<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leonor Sevinate Pinto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#000000; --muted:#777777; --line:#e4e4e4;
  --font:"Space Grotesk",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:72px 24px 40px}
h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:500;margin:0 0 12px}
p{margin:0 0 48px;font-size:16px;line-height:1.5;color:var(--muted)}
nav{border-top:1px solid var(--line)}
nav a{display:flex;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:18px}
nav a:hover{color:var(--muted)}
nav a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
.hero{display:block;width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 0 28px}
</style>
</head>
<body>
<main>
  <img class="hero" src="profile.jpg" alt="Leonor Sevinate Pinto">
  <h1>Leonor Sevinate Pinto</h1>
  <p>Graphic designer based in Lisbon.</p>
  <nav>
    <a href="https://leonorspinto.github.io/leonor-portfolio/">Portfolio <span aria-hidden="true">&rarr;</span></a>
    <!--
<a href="https://leonorspinto.github.io/leonor-portfolio/contact/index.html">Inquiry <span aria-hidden="true">&rarr;</span></a>
-->
    <a href="mailto:leonorfspinto@gmail.com?subject=Hello%20Leonor">Email <span aria-hidden="true">&rarr;</span></a>
  </nav>
  <footer>&copy; 2026 Leonor Sevinate Pinto</footer>
</main>
</body>
</html>
